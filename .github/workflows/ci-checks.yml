name: Security & Verification Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numpy
        run: python -m pip install --no-cache-dir numpy

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 1. Cross-check stimulus & staircase (JS vs Python)
        run: python -I -X utf8 tools/cross_check.py

      - name: 2. App flow, XSS, CSP, privacy & i18n checks
        run: deno run --allow-read --allow-write=/tmp tools/app_check.js --dump /tmp/ci_result.json

      - name: 3. Independent result verification (Python)
        run: python -I -X utf8 tools/verify_result.py /tmp/ci_result.json

      - name: 4. Static privacy, CSP & build-hash integrity audit
        run: |
          python -I -X utf8 - <<'PY'
          import hashlib, json, re

          app_files = ['index.html', 'style.css', 'js/protocols.js', 'js/stim.js', 'js/track.js', 'js/app.js']
          rec = json.load(open('검증_통과.json', encoding='utf-8'))
          fh = {f: hashlib.sha256(open(f, 'rb').read()).hexdigest() for f in app_files}
          whole = hashlib.sha256(''.join(f'{k}:{fh[k]}\n' for k in sorted(fh)).encode('utf-8')).hexdigest()
          assert rec['last']['ok'] is True, '검증_통과.json last.ok != True'
          assert rec['last']['buildSha256'] == whole and rec['last']['files'] == fh, 'App file hashes do not match 검증_통과.json'

          for f in app_files:
              txt = open(f, encoding='utf-8').read()
              for pat in (
                  r'\bXMLHttpRequest\b',
                  r'\bWebSocket\b',
                  r'\bEventSource\b',
                  r'\bsendBeacon\b',
                  r'\bdocument\.cookie\b',
                  r'\bindexedDB\b',
                  r'(?:src|href|action)\s*=\s*["\']https?://',
                  r'url\(\s*["\']?https?://',
              ):
                  assert not re.search(pat, txt), f'Forbidden pattern {pat} found in {f}'

          idx = open('index.html', encoding='utf-8').read()
          assert "default-src 'none'" in idx and "script-src 'self'" in idx and "connect-src 'self'" in idx
          app_js = open('js/app.js', encoding='utf-8').read()
          assert "script-src 'none'" in app_js and "connect-src 'none'" in app_js
          print('Static privacy, CSP & build-hash audit: PASS')
          PY
